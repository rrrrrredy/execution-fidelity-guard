name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 20
          - 22

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Unit and regression tests
        run: node --test

      - name: Synchronized package assets
        run: node scripts/sync-package-assets.mjs --check

      - name: Frozen replay evidence boundary
        run: node scripts/audit-replay-coverage.mjs --check

      - name: Market release package
        run: node scripts/validate-release.mjs

      - name: Source-only doctor
        run: node plugins/execution-fidelity-guard/bin/efg.mjs doctor --json

      - name: Source-only prohibited-install simulation
        run: node scripts/assert-source-simulation.mjs

      - name: Packaged artifact is self-consistent
        run: npm run verify:package-surface

      - name: Real tarball executes its release gates
        run: npm run verify:packed-execution
